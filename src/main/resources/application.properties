# =============================================================================
# AMITY UNIVERSITY NOIDA - LIBRARY MANAGEMENT SYSTEM CONFIGURATION
# =============================================================================

# Database Configuration (MySQL 8.0+)
# Can be overridden via environment variables: DB_URL, DB_USERNAME, DB_PASSWORD
db.url=jdbc:mysql://localhost:3306/amity_library?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8
db.username=root
db.password=parth
db.pool.maxSize=15
db.pool.minIdle=3
db.pool.idleTimeoutMs=300000
db.pool.connectionTimeoutMs=20000

# Cloudflare Turnstile Configuration
# Can be overridden via environment variables: TURNSTILE_SITE_KEY, TURNSTILE_SECRET_KEY
# Default keys below are Cloudflare's official non-interactive dummy keys for development:
# Site Key: 1x00000000000000000000AA (Always passes)
# Secret Key: 1x0000000000000000000000000000000AA (Always passes)
turnstile.enabled=true
turnstile.siteKey=1x00000000000000000000AA
turnstile.secretKey=1x0000000000000000000000000000000AA
turnstile.verifyUrl=https://challenges.cloudflare.com/turnstile/v0/siteverify
turnstile.timeoutSeconds=5

# Application & Security Settings
app.sessionTimeoutMinutes=30
app.rateLimit.loginMaxAttempts=5
app.rateLimit.windowMinutes=15
app.csrf.enabled=true
